{% extends "base.html" %}

{% block title %} — Register{% endblock %}

{% block nav %}{% endblock %}

{% block content %}
<div style="max-width:400px;margin:4rem auto;">
  <div class="card">
    <h2 style="text-align:center;margin-bottom:1.5rem;">Create Account</h2>

    {% if let Some(error) = error %}
      <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/register">
      <div class="form-group">
        <label>Name</label>
        <input type="text" name="name" placeholder="Your name" required minlength="2"/>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" placeholder="you@email.com" required/>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="Min. 8 characters" required minlength="8"/>
      </div>
      <button type="submit" style="width:100%;margin-top:0.5rem;">Create Account</button>
    </form>

    <p class="text-center mt-2" style="font-size:0.9rem;color:#94a3b8;">
      Already have an account? <a href="/login">Sign in</a>
    </p>
  </div>
</div>
{% endblock %}
