[workspace]
members = [
    "core_business",
    "infra_data",
    "api_server_new",
]
resolver = "2"

[workspace.dependencies]
tokio        = { version = "1",    default-features = false, features = ["rt-multi-thread", "macros", "time"] }
reqwest      = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
axum         = { version = "0.7",  default-features = false, features = ["macros", "http1", "json", "tokio", "form", "query"] }
askama       = { version = "0.12", default-features = false, features = ["with-axum"] }
askama_axum  = { version = "0.4",  default-features = false }
sqlx         = { version = "0.7",  default-features = false, features = ["macros", "postgres", "runtime-tokio", "uuid", "chrono", "migrate"] }
jsonwebtoken = { version = "9",    default-features = false }
bcrypt       = { version = "0.15", default-features = false, features = ["std"] }
serde        = { version = "1",    default-features = false, features = ["derive"] }
serde_json   = { version = "1",    default-features = false }
color-eyre   = { version = "0.6",  default-features = false }
secrecy      = { version = "0.10", default-features = false, features = ["serde"] }
validator    = { version = "0.18", default-features = false, features = ["derive"] }
tracing      = { version = "0.1",  default-features = false }
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt"] }
uuid         = { version = "1",    default-features = false, features = ["v4", "serde"] }
chrono       = { version = "0.4",  default-features = false, features = ["serde", "now"] }
tower-http   = { version = "0.5",  default-features = false, features = ["fs", "trace"] }
thiserror    = { version = "1",    default-features = false }
async-trait  = { version = "0.1",  default-features = false }

# Test utilities
pretty_assertions = { version = "1.4", default-features = false, features = ["std"] }
claim             = { version = "0.5",  default-features = false }
mockall           = { version = "0.12", default-features = false }
proptest          = { version = "1.5",  default-features = false, features = ["std"] }