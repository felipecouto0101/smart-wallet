[advisories]
ignore = [
    # rsa 0.9.10 - Marvin Attack (RUSTSEC-2023-0071)
    # No fix available upstream. rsa is pulled by sqlx-mysql which is an
    # optional sqlx backend; this project uses PostgreSQL only (feature
    # "postgres", no "mysql"). sqlx-mysql is never compiled or linked.
    # The entry exists in Cargo.lock solely because cargo resolves all
    # optional dependencies of workspace crates regardless of activation.
    "RUSTSEC-2023-0071",
]
